name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify modules
        run: go mod verify

      - name: Lint (includes gofumpt/goimports check)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck deploy scripts
        run: shellcheck deploy/cloudrun/*.sh deploy/monitoring/*.sh

      - name: Build production image
        run: DOCKER_BUILDKIT=1 docker build -t booknow-mcp:ci .
