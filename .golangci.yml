version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - misspell
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    # security & resources (webhooks, SQL, HTTP clients)
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # logging
    - sloglint
    - loggercheck
    # testing
    - thelper
    - usetesting
    # modernization & meta
    - modernize
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint

  settings:
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    sloglint:
      attr-only: false
      no-global: default
      context: scope
    exhaustive:
      default-signifies-exhaustive: true

  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [funlen, gosec, forcetypeassert]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/Ps3udoDev/booknow-mcp-service
  exclusions:
    generated: lax
